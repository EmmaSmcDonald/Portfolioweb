<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scoreboard - Callots Triangle</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100dvh;
    }

    .header-bar {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }

    .back-btn {
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }

    h1 {
      flex: 1;
      text-align: center;
      font-size: 20px;
      margin: 0;
    }

    .scores-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .score-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 15px;
    }

    /* Podium styles for Top 3 */
    .rank-1 { border-color: #ffd700; background: rgba(255, 215, 0, 0.08); }
    .rank-2 { border-color: #c0c0c0; background: rgba(192, 192, 192, 0.08); }
    .rank-3 { border-color: #cd7f32; background: rgba(205, 127, 50, 0.08); }

    .player-info {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .rank-number {
      font-weight: bold;
      width: 24px;
      color: #888;
    }
    .rank-1 .rank-number { color: #ffd700; }
    .rank-2 .rank-number { color: #c0c0c0; }
    .rank-3 .rank-number { color: #cd7f32; }

    .player-name {
      font-weight: bold;
    }

    .score-time {
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
    }

    .loading, .no-scores {
      text-align: center;
      color: #888;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <a href="index.html" class="back-btn">⬅ Home</a>
    <h1>Scoreboard</h1>
  </div>

  <div id="scores-list" class="scores-container">
    <div class="loading">Loading scores...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://quywbkffnyoemooinirk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zqZoZBpE53VUjUGAik75Sw_6WxNQOju";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const scoresListContainer = document.getElementById("scores-list");

    async function fetchScoreboard() {
      // Fetch successful results ordered by fastest time first
      const { data, error } = await db
        .from("disarm_game_results")
        .select("*")
        .eq("status", "DEFUSED")
        .order("time_seconds", { ascending: true });

      if (error) {
        scoresListContainer.innerHTML = `<div class="no-scores">Error loading scores.</div>`;
        return;
      }

      if (!data || data.length === 0) {
        scoresListContainer.innerHTML = `<div class="no-scores">No completed games yet! Be the first!</div>`;
        return;
      }

      let html = "";
      data.forEach((score, index) => {
        const rank = index + 1;
        let rankClass = "";
        if (rank === 1) rankClass = "rank-1";
        else if (rank === 2) rankClass = "rank-2";
        else if (rank === 3) rankClass = "rank-3";

        const playerName = score.player_name || "Anonymous";
        const timeVal = score.time_seconds ? `${score.time_seconds.toFixed(2)}s` : "--";

        html += `
          <div class="score-card ${rankClass}">
            <div class="player-info">
              <span class="rank-number">#${rank}</span>
              <span class="player-name">${escapeHtml(playerName)}</span>
            </div>
            <div class="score-time">${timeVal}</div>
          </div>
        `;
      });

      scoresListContainer.innerHTML = html;
    }

    // Basic security utility to avoid raw HTML injection in names
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    fetchScoreboard();
  </script>

</body>
</html>
