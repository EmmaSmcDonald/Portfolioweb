<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Detangle Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 10px;
      height: 100dvh;
      overflow: hidden;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
      gap: 14px;
    }

    /* Single-row top control bar */
    #top-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      width: 100%;
    }

    .back-btn, .reset-btn {
      padding: 8px 10px;
      font-size: 14px;
      font-weight: bold;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }
    .reset-btn { background: #d9534f; }

    #status-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #dc3545;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      font-size: 14px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }

    button#start-btn {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    button#start-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 6px 0;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      font-family: monospace;
    }

    #status-msg {
      font-size: 15px;
      font-weight: bold;
      text-transform: uppercase;
      height: 20px;
      text-align: center;
    }

    /* Game Rules Blurb */
    .instructions-box {
      background: #252525;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #bbb;
      line-height: 1.4;
      width: 100%;
      text-align: center;
      border: 1px dashed #444;
    }

    .leaderboard-link {
      color: #28a745;
      font-size: 14px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- Single Top Bar Row -->
    <div id="top-bar">
      <a href="index.html" class="back-btn">⬅</a>
      <button id="reset-btn" class="reset-btn" title="Tare/Reset Scale">🔄</button>
      <div id="status-icon" title="ESP32 Status"></div>
      <input type="text" id="player-name" placeholder="Player Name" autocomplete="off">
      <button id="start-btn" disabled>START</button>
    </div>

    <!-- Stats Row (Timer & Live Sensor Weight) -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Time</div>
        <div id="timer" class="stat-value">0.00s</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Scale Weight</div>
        <div id="live-weight" class="stat-value">--g</div>
      </div>
    </div>

    <div id="status-msg">CLEAR ALL WEIGHTS!</div>

    <!-- Rules Blurb -->
    <div class="instructions-box">
      <strong>How to Play:</strong> Place all 4 weights on the plate, enter your name, and hit Start. Navigate through the physical obstacles outside and remove all weights as fast as possible to win!
    </div>
    
    <a href="detangle_leaderboard.html" class="leaderboard-link">🏆 View Detangle Leaderboard</a>
  </div>

  <script>
    const SUPABASE_URL = "https://quywbkffnyoemooinirk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zqZoZBpE53VUjUGAik75Sw_6WxNQOju";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const nameInput = document.getElementById("player-name");
    const startBtn = document.getElementById("start-btn");
    const resetBtn = document.getElementById("reset-btn");
    const timerDisplay = document.getElementById("timer");
    const liveWeightDisplay = document.getElementById("live-weight");
    const statusMsg = document.getElementById("status-msg");
    const statusIcon = document.getElementById("status-icon");

    let timerInterval = null;
    let pollInterval = null;
    let startTime = 0;
    let activeChannel = null;
    let lastKnownWeight = 0;

    async function pollESPStatus() {
      const { data } = await db.from("detangle_game_control").select("heartbeat, current_weight, command").eq("id", 1).single();
      const currentTime = Date.now();

      if (data && data.heartbeat !== null) {
        if (data.heartbeat !== lastHeartbeatValue) {
          lastHeartbeatValue = data.heartbeat;
          lastChangeTime = currentTime;
          statusIcon.style.background = "#28a745";
        } else {
          if (currentTime - lastChangeTime > 12000) {
            statusIcon.style.background = "#dc3545";
          }
        }
        
        if (data.current_weight !== undefined && data.current_weight !== null) {
          lastKnownWeight = data.current_weight;
          liveWeightDisplay.innerText = `${Math.round(data.current_weight)}g`;
        }

        if (data.command === "IDLE" && statusMsg.innerText.includes("PLACE ALL 4")) {
          statusMsg.innerText = "CLEAR ALL WEIGHTS!";
          statusMsg.style.color = "#fff";
        }
      } else {
        statusIcon.style.background = "#dc3545";
      }
    }
    let lastHeartbeatValue = null;
    let lastChangeTime = Date.now();
    setInterval(pollESPStatus, 1500);

    nameInput.addEventListener("input", () => {
      startBtn.disabled = nameInput.value.trim() === "";
    });

    resetBtn.addEventListener("click", async () => {
      resetBtn.disabled = true;
      statusMsg.innerText = "RESETTING SCALE...";
      statusMsg.style.color = "#ffc107";
      
      await db.from("detangle_game_control").update({ command: "RESET_SCALE" }).eq("id", 1);
      
      setTimeout(() => {
        resetBtn.disabled = false;
        statusMsg.innerText = "SCALE RESET!";
        statusMsg.style.color = "#28a745";
      }, 1000);
    });

    async function handleGameResult(result) {
      if (!timerInterval) return;

      clearInterval(timerInterval);
      clearInterval(pollInterval);
      timerInterval = null;

      const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
      timerDisplay.innerText = `${finalTime}s`;

      if (result.id) {
        await db.from("detangle_game_results").update({ 
          player_name: nameInput.value.trim(),
          time_seconds: parseFloat(finalTime) 
        }).eq("id", result.id);
      }

      statusMsg.innerText = "SUCCESS!";
      statusMsg.style.color = "#28a745";

      if (activeChannel) {
        db.removeChannel(activeChannel);
        activeChannel = null;
      }

      setTimeout(() => {
        startBtn.disabled = false;
        nameInput.disabled = false;
        statusMsg.innerText = "CLEAR ALL WEIGHTS!";
        statusMsg.style.color = "#fff";
      }, 3000);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      nameInput.disabled = true;
      statusMsg.innerText = "CHECKING WEIGHTS...";
      statusMsg.style.color = "#ffc107";

      activeChannel = db.channel('detangle-results')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'detangle_game_results' }, payload => {
          handleGameResult(payload.new);
        })
        .subscribe();

      await db.from("detangle_game_control").update({ command: "START" }).eq("id", 1);

      let checkAttempts = 0;
      let startAccepted = false;

      const checkInterval = setInterval(async () => {
        checkAttempts++;
        const { data } = await db.from("detangle_game_control").select("command").eq("id", 1).single();

        if (data && data.command === "ERROR_WEIGHTS") {
          clearInterval(checkInterval);
          statusMsg.innerText = "PLACE ALL 4 WEIGHTS FIRST!";
          statusMsg.style.color = "#dc3545";
          
          startBtn.disabled = false;
          nameInput.disabled = false;
          startAccepted = true;
        } else if (data && data.command === "IDLE" && !startAccepted) {
          clearInterval(checkInterval);
          startAccepted = true;
          statusMsg.style.color = "#fff";
          statusMsg.innerText = "GO!";

          startTime = Date.now();
          timerInterval = setInterval(() => {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            timerDisplay.innerText = `${elapsed}s`;
          }, 50);

          const gameStartTimeStamp = new Date().toISOString();
          pollInterval = setInterval(async () => {
            const { data: resData } = await db.from("detangle_game_results")
              .select("*")
              .gt("created_at", gameStartTimeStamp)
              .order("created_at", { ascending: false })
              .limit(1);

            if (resData && resData.length > 0) {
              handleGameResult(resData[0]);
            }
          }, 1000);
        }

        if (checkAttempts > 15 && !startAccepted) {
          clearInterval(checkInterval);
          statusMsg.innerText = "ESP32 ERROR";
          statusMsg.style.color = "#dc3545";
          startBtn.disabled = false;
          nameInput.disabled = false;
        }
      }, 300);
    });
  </script>
</body>
</html>
