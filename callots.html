
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Defuse</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121212;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding-top: calc(env(safe-area-inset-top) + 6px);
      padding-right: 6px;
      padding-bottom: calc(env(safe-area-inset-bottom) + 6px);
      padding-left: 6px;
      overflow: hidden;
      font-family: sans-serif;
      background: #121212;
      color: #fff;
      transform: rotate(180deg);
      transform-origin: center center;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
      max-width: 520px;
      height: 100%;
      min-height: 0;
      padding: 8px;
      overflow: hidden;
      background: #1b1b1b;
      border: 1px solid #303030;
      border-radius: 12px;
    }

    #top-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: bold;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      font-size: 14px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    input:focus {
      border-color: #007bff;
    }

    button {
      flex-shrink: 0;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    #status-icon {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #dc3545;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    #timer {
      min-width: 55px;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: bold;
      text-align: right;
      white-space: nowrap;
    }

    #status-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 18px;
      margin: 0;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    #camera-container {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      margin-top: auto;
      overflow: hidden;
      background: #000;
      border-radius: 8px;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: rotate(180deg);
    }

    .deadzone-block {
      position: absolute;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 15%;
      background: #000;
      border-top: 2px dashed rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      letter-spacing: 2px;
      pointer-events: none;
    }

    @media (max-width: 380px) {
      .game-card {
        gap: 5px;
        padding: 6px;
      }

      #top-bar {
        gap: 4px;
      }

      .back-btn {
        padding: 8px;
      }

      input {
        padding: 8px 6px;
        font-size: 12px;
      }

      button {
        padding: 8px 9px;
        font-size: 12px;
      }

      #timer {
        min-width: 46px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <main class="game-card">

    <div id="top-bar">
      <a href="index.html" class="back-btn" aria-label="Back to menu">⬅</a>

      <div id="status-icon" title="ESP32 Status"></div>

      <input
        type="text"
        id="player-name"
        placeholder="Player Name"
        autocomplete="off"
      >

      <button id="start-btn" disabled>START</button>

      <div id="timer">0.00s</div>
    </div>

    <div id="status-msg"></div>

    <div id="camera-container">
      <video id="webcam" autoplay playsinline></video>
      <div class="deadzone-block">DEADZONE</div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://quywbkffnyoemooinirk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zqZoZBpE53VUjUGAik75Sw_6WxNQOju";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const nameInput = document.getElementById("player-name");
    const startBtn = document.getElementById("start-btn");
    const timerDisplay = document.getElementById("timer");
    const statusMsg = document.getElementById("status-msg");
    const statusIcon = document.getElementById("status-icon");
    const videoElement = document.getElementById("webcam");

    let timerInterval = null;
    let pollInterval = null;
    let startTime = 0;
    let activeChannel = null;
    let currentStream = null;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        });

        currentStream = stream;
        videoElement.srcObject = stream;
      } catch (e) {
        try {
          const fallbackStream =
            await navigator.mediaDevices.getUserMedia({
              video: true
            });

          currentStream = fallbackStream;
          videoElement.srcObject = fallbackStream;
        } catch (err) {
          console.error("Camera unavailable:", err);
          statusMsg.innerText = "NO CAMERA";
          statusMsg.style.color = "#dc3545";
        }
      }
    }

    startCamera();

    let lastHeartbeatValue = null;
    let lastChangeTime = Date.now();

    async function checkESPConnection() {
      const { data, error } = await db
        .from("disarm_game_control")
        .select("heartbeat")
        .eq("id", 1)
        .single();

      const currentTime = Date.now();

      if (!error && data && data.heartbeat !== null) {
        if (data.heartbeat !== lastHeartbeatValue) {
          lastHeartbeatValue = data.heartbeat;
          lastChangeTime = currentTime;
          statusIcon.style.background = "#28a745";
        } else if (currentTime - lastChangeTime > 12000) {
          statusIcon.style.background = "#dc3545";
        }
      } else {
        statusIcon.style.background = "#dc3545";
      }
    }

    checkESPConnection();
    setInterval(checkESPConnection, 3000);

    nameInput.addEventListener("input", () => {
      startBtn.disabled = nameInput.value.trim() === "";
    });

    async function handleGameResult(result) {
      if (!timerInterval) return;

      clearInterval(timerInterval);
      clearInterval(pollInterval);

      timerInterval = null;
      pollInterval = null;

      const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
      timerDisplay.innerText = `${finalTime}s`;

      if (result.id) {
        await db
          .from("disarm_game_results")
          .update({
            player_name: nameInput.value.trim(),
            time_seconds: parseFloat(finalTime)
          })
          .eq("id", result.id);
      }

      if (result.status === "DEFUSED") {
        statusMsg.innerText = "SUCCESS";
        statusMsg.style.color = "#28a745";
      } else {
        statusMsg.innerText = "FAIL";
        statusMsg.style.color = "#dc3545";
      }

      if (activeChannel) {
        db.removeChannel(activeChannel);
        activeChannel = null;
      }

      setTimeout(() => {
        startBtn.disabled = nameInput.value.trim() === "";
        nameInput.disabled = false;
      }, 3000);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      nameInput.disabled = true;

      statusMsg.innerText = "CHECKING...";
      statusMsg.style.color = "#ffc107";

      if (activeChannel) {
        await db.removeChannel(activeChannel);
        activeChannel = null;
      }

      activeChannel = db
        .channel("results-listener")
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "disarm_game_results"
          },
          payload => {
            handleGameResult(payload.new);
          }
        )
        .subscribe();

      const { error: startError } = await db
        .from("disarm_game_control")
        .update({ command: "START" })
        .eq("id", 1);

      if (startError) {
        console.error("Could not start game:", startError);
        statusMsg.innerText = "CONNECTION ERROR";
        statusMsg.style.color = "#dc3545";
        startBtn.disabled = false;
        nameInput.disabled = false;
        return;
      }

      let checkAttempts = 0;
      let startAccepted = false;

      const checkInterval = setInterval(async () => {
        checkAttempts++;

        const { data, error } = await db
          .from("disarm_game_control")
          .select("command")
          .eq("id", 1)
          .single();

        if (error) {
          if (checkAttempts > 15) {
            clearInterval(checkInterval);
            statusMsg.innerText = "ESP32 ERROR";
            statusMsg.style.color = "#dc3545";
            startBtn.disabled = false;
            nameInput.disabled = false;
          }
          return;
        }

        if (data && data.command === "ERROR_WIRES") {
          clearInterval(checkInterval);

          statusMsg.innerText = "CONNECT WIRES!";
          statusMsg.style.color = "#dc3545";

          await db
            .from("disarm_game_control")
            .update({ command: "IDLE" })
            .eq("id", 1);

          startBtn.disabled = false;
          nameInput.disabled = false;
          startAccepted = true;

        } else if (
          data &&
          data.command === "IDLE" &&
          !startAccepted
        ) {
          clearInterval(checkInterval);
          startAccepted = true;

          statusMsg.style.color = "#fff";
          statusMsg.innerText = "ACTIVE";

          startTime = Date.now();

          const gameStartTimeStamp = new Date().toISOString();

          timerInterval = setInterval(() => {
            const elapsed =
              ((Date.now() - startTime) / 1000).toFixed(2);

            timerDisplay.innerText = `${elapsed}s`;
          }, 50);

          pollInterval = setInterval(async () => {
            const { data: resData } = await db
              .from("disarm_game_results")
              .select("*")
              .gt("created_at", gameStartTimeStamp)
              .order("created_at", { ascending: false })
              .limit(1);

            if (resData && resData.length > 0) {
              handleGameResult(resData[0]);
            }
          }, 1000);
        }

        if (checkAttempts > 15 && !startAccepted) {
          clearInterval(checkInterval);

          statusMsg.innerText = "ESP32 ERROR";
          statusMsg.style.color = "#dc3545";

          startBtn.disabled = false;
          nameInput.disabled = false;
        }
      }, 300);
    });
  </script>
</body>
</html>
