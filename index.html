<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cut The Wire Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 20px; }
    #controls { display: flex; gap: 10px; margin-bottom: 15px; }
    input { padding: 8px; font-size: 16px; width: 200px; }
    button { padding: 8px 16px; font-size: 16px; }
    #timer { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
    #status-msg { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
    #camera-container { width: 100%; max-width: 640px; height: 480px; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <h1>Cut The Wire Game</h1>

  <div id="controls">
    <input type="text" id="player-name" placeholder="Enter your name">
    <button id="start-btn" disabled>Start Game</button>
  </div>

  <div id="timer">0.00s</div>
  <div id="status-msg"></div>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <script>
    const SUPABASE_URL = "https://quywbkffnyoemooinirk.supabase.co/rest/v1/disarm_game_control";
    const SUPABASE_ANON_KEY = "sb_publishable_zqZoZBpE53VUjUGAik75Sw_6WxNQOju";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const nameInput = document.getElementById("player-name");
    const startBtn = document.getElementById("start-btn");
    const timerDisplay = document.getElementById("timer");
    const statusMsg = document.getElementById("status-msg");
    const videoElement = document.getElementById("webcam");

    let timerInterval = null;
    let startTime = 0;

    // Start Camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
        videoElement.srcObject = stream;
      } catch (e) {
        try { videoElement.srcObject = await navigator.mediaDevices.getUserMedia({ video: true }); } catch (err) {}
      }
    }
    startCamera();

    nameInput.addEventListener("input", () => {
      startBtn.disabled = nameInput.value.trim() === "";
    });

    // Start Game Button Clicked
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      nameInput.disabled = true;
      statusMsg.innerText = "DEFUSE THE BOMB!";

      // Tell ESP32 to start via Supabase
      await db.from("game_control").update({ command: "START" }).eq("id", 1);

      // Start local timer
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
        timerDisplay.innerText = `${elapsed}s`;
      }, 50);

      // Listen for result from ESP32 using Supabase Realtime
      db.channel('results-listener')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'game_results' }, payload => {
          const result = payload.new;
          
          // Stop timer
          clearInterval(timerInterval);
          const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
          timerDisplay.innerText = `${finalTime}s`;

          // Update player name in the inserted row with the actual typed name
          db.from("game_results").update({ player_name: nameInput.value.trim() }).eq("id", result.id);

          // Show status
          statusMsg.innerText = result.status === "DEFUSED" ? "BOMB DEFUSED!" : "BOOM! GAME OVER!";

          // Reset UI
          setTimeout(() => {
            startBtn.disabled = false;
            nameInput.disabled = false;
          }, 3000);

          // Remove listener
          db.removeChannel(this);
        })
        .subscribe();
    });
  </script>
</body>
</html>
