<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cut The Wire Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 20px; }
    #controls { display: flex; gap: 10px; margin-bottom: 15px; }
    input { padding: 8px; font-size: 16px; width: 200px; }
    button { padding: 8px 16px; font-size: 16px; }
    #esp-status { font-weight: bold; margin-bottom: 10px; }
    #timer { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
    #status-msg { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
    #camera-container { width: 100%; max-width: 640px; height: 480px; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <h1>Cut The Wire Game</h1>

  <!-- ESP32 Connection Indicator -->
  <div id="esp-status">ESP32 Status: Checking...</div>

  <div id="controls">
    <input type="text" id="player-name" placeholder="Enter your name">
    <button id="start-btn" disabled>Start Game</button>
  </div>

  <div id="timer">0.00s</div>
  <div id="status-msg"></div>

  <div id="camera-container">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <script>
    const SUPABASE_URL = "https://quywbkffnyoemooinirk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zqZoZBpE53VUjUGAik75Sw_6WxNQOju";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const nameInput = document.getElementById("player-name");
    const startBtn = document.getElementById("start-btn");
    const timerDisplay = document.getElementById("timer");
    const statusMsg = document.getElementById("status-msg");
    const espStatusDisplay = document.getElementById("esp-status");
    const videoElement = document.getElementById("webcam");

    let timerInterval = null;
    let pollInterval = null;
    let startTime = 0;
    let activeChannel = null;

    // Start Back-Facing Camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        });
        videoElement.srcObject = stream;
      } catch (e) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
          videoElement.srcObject = fallbackStream;
        } catch (err) {
          console.error("Camera access denied or unavailable.");
        }
      }
    }
    startCamera();

    // Check ESP32 Online Status every 3 seconds
    let lastHeartbeatValue = null;
    let lastChangeTime = Date.now();

    // Check if ESP32 heartbeat counter is actively changing
    async function checkESPConnection() {
      const { data, error } = await db.from("disarm_game_control").select("heartbeat").eq("id", 1).single();
      
      const currentTime = Date.now();

      if (data && data.heartbeat !== null) {
        if (data.heartbeat !== lastHeartbeatValue) {
          // Heartbeat changed! ESP32 is online and ticking.
          lastHeartbeatValue = data.heartbeat;
          lastChangeTime = currentTime;
          espStatusDisplay.innerText = "ESP32 Status: Connected & Online";
          espStatusDisplay.style.color = "green";
        } else {
          // Heartbeat is the same. Has it been frozen for more than 6 seconds?
          if (currentTime - lastChangeTime > 6000) {
            espStatusDisplay.innerText = "ESP32 Status: Offline / Not responding";
            espStatusDisplay.style.color = "red";
          }
        }
      } else {
        espStatusDisplay.innerText = "ESP32 Status: Offline / Not responding";
        espStatusDisplay.style.color = "red";
      }
    }
    setInterval(checkESPConnection, 3000); // Check every 3 seconds

    nameInput.addEventListener("input", () => {
      startBtn.disabled = nameInput.value.trim() === "";
    });

    // Helper function when game ends
    async function handleGameResult(result) {
      if (!timerInterval) return; // Prevent double trigger

      // 1. Stop local timer immediately
      clearInterval(timerInterval);
      clearInterval(pollInterval);
      timerInterval = null;

      // 2. Calculate the exact time from the website's perspective
      const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
      timerDisplay.innerText = `${finalTime}s`;

      // 3. Save the accurate final time and player name to the database result row
      if (result.id) {
        await db.from("disarm_game_results").update({ 
          player_name: nameInput.value.trim(),
          time_seconds: parseFloat(finalTime) 
        }).eq("id", result.id);
      }

      statusMsg.innerText = result.status === "DEFUSED" ? "BOMB DEFUSED!" : "BOOM! GAME OVER!";

      if (activeChannel) {
        db.removeChannel(activeChannel);
        activeChannel = null;
      }

      setTimeout(() => {
        startBtn.disabled = false;
        nameInput.disabled = false;
      }, 3000);
    }

    // Start Game Button Clicked
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      nameInput.disabled = true;
      statusMsg.innerText = "CHECKING WIRES...";

      // 1. Setup Realtime Listener for results FIRST
      activeChannel = db.channel('results-listener')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'disarm_game_results' }, payload => {
          handleGameResult(payload.new);
        })
        .subscribe();

      // 2. Tell ESP32 to start via Supabase
      await db.from("disarm_game_control").update({ command: "START" }).eq("id", 1);

      // 3. Check if ESP32 accepted it or threw a wire error (poll for 1.5 seconds)
      let checkAttempts = 0;
      let startAccepted = false;

      const checkInterval = setInterval(async () => {
        checkAttempts++;
        const { data } = await db.from("disarm_game_control").select("command").eq("id", 1).single();

        if (data && data.command === "ERROR_WIRES") {
          // ESP32 rejected the start because wires are disconnected!
          clearInterval(checkInterval);
          statusMsg.innerText = "ERROR: Connect all wires first!";
          statusMsg.style.color = "red";
          
          // Reset command back to IDLE in database
          await db.from("disarm_game_control").update({ command: "IDLE" }).eq("id", 1);

          // Re-enable start button
          startBtn.disabled = false;
          nameInput.disabled = false;
          startAccepted = true;
        } else if (data && data.command === "IDLE" && !startAccepted) {
          // ESP32 accepted it and started!
          clearInterval(checkInterval);
          startAccepted = true;
          statusMsg.style.color = "black";
          statusMsg.innerText = "DEFUSE THE BOMB!";

          // Start local timer (using website as authority)
          startTime = Date.now();
          timerInterval = setInterval(() => {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            timerDisplay.innerText = `${elapsed}s`;
          }, 50);

          // Backup Poller for results
          const gameStartTimeStamp = new Date().toISOString();
          pollInterval = setInterval(async () => {
            const { data: resData } = await db.from("disarm_game_results")
              .select("*")
              .gt("created_at", gameStartTimeStamp)
              .order("created_at", { ascending: false })
              .limit(1);

            if (resData && resData.length > 0) {
              handleGameResult(resData[0]);
            }
          }, 1000);
        }

        // If it times out (ESP32 offline)
        if (checkAttempts > 5 && !startAccepted) {
          clearInterval(checkInterval);
          statusMsg.innerText = "ESP32 not responding!";
          startBtn.disabled = false;
          nameInput.disabled = false;
        }
      }, 300);
    });
  </script>
</body>
</html>
