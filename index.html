<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Homepage</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
      height: 100dvh;
      overflow: hidden;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 320px;
    }

    .row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }

    .btn:active {
      background: #0056b3;
    }

    /* Scoreboard button sitting to the right of Callots Triangle */
    .btn-scoreboard {
      background: #28a745;
    }
    .btn-scoreboard:active {
      background: #1e7e34;
    }

    .btn-detangle {
      background: #6c757d;
    }
  </style>
</head>
<body>

  <h1>GAME HUB</h1>

  <div class="menu-container">
    <!-- Row 1: Callots Triangle & Scoreboard to the right -->
    <div class="row">
      <a href="callots.html" class="btn">Callots Triangle</a>
      <a href="callots_scoreboard.html" class="btn btn-scoreboard">Scoreboard</a>
    </div>

    <!-- Row 2: Detangle -->
     <div class="menu-container">
        <a href="detangle.html" class="btn btn-detangle">Detangle</a>
        <a href="detangle_leaderboard.html" class="btn btn-detangle">Scoreboards</a>
     </div>
  </div>

</body>
</html>
