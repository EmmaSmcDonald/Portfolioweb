<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cut The Wire Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    
    /* Flips the entire website upside down for the inverted camera mount */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
      height: 100vh;
      overflow: hidden;
      transform: rotate(180deg);
    }

    h1 {
      font-size: 18px;
      margin: 2px 0;
    }

    #esp-status {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    #controls {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 3px;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 15px;
    }

    button {
      padding: 10px 14px;
      font-size: 15px;
    }

    #timer {
      font-size: 26px;
      font-weight: bold;
      margin: 2px 0;
    }

    #status-msg {
      font-size: 16px;
      font-weight: bold;
      height: 22px;
      margin-bottom: 3px;
    }

    /* Large Full-Screen Camera Container */
    #camera-container {
      width: 100%;
      flex: 1;
      max-height: 60vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <h1>Cut The Wire Game</h1>

  <!-- ESP32 Connection Indicator -->
  <div id="esp-status">ESP32 Status: Checking...</div>

  <!-- Controls -->
  <div id="controls">
    <input type="text" id="player-name" placeholder="Enter your name">
    <button id="flip-camera-btn" type="button">🔄 Flip</button>
    <button id="start-btn" disabled>Start</button>
  </div>

  <div id="timer">0.00s</div>
  <div id="status-msg"></div>

  <!-- Large Camera Feed -->
  <div id="camera-container">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <script>
    const SUPABASE_URL = "https://quywbkffnyoemooinirk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zqZoZBpE53VUjUGAik75Sw_6WxNQOju";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const nameInput = document.getElementById("player-name");
    const startBtn = document.getElementById("start-btn");
    const flipCameraBtn = document.getElementById("flip-camera-btn");
    const timerDisplay = document.getElementById("timer");
    const statusMsg = document.getElementById("status-msg");
    const espStatusDisplay = document.getElementById("esp-status");
    const videoElement = document.getElementById("webcam");

    let timerInterval = null;
    let pollInterval = null;
    let startTime = 0;
    let activeChannel = null;
    let useEnvironmentCamera = true;
    let currentStream = null;

    // Start / Switch Camera Function
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const facingMode = useEnvironmentCamera ? { exact: "environment" } : "user";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode }
        });
        currentStream = stream;
        videoElement.srcObject = stream;
      } catch (e) {
        // Fallback if exact environment constraint fails
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: useEnvironmentCamera ? "environment" : "user" }
          });
          currentStream = fallbackStream;
          videoElement.srcObject = fallbackStream;
        } catch (err) {
          try {
            const genericStream = await navigator.mediaDevices.getUserMedia({ video: true });
            currentStream = genericStream;
            videoElement.srcObject = genericStream;
          } catch (finalErr) {
            console.error("Camera access denied or unavailable.");
            statusMsg.innerText = "Camera Error!";
          }
        }
      }
    }
    startCamera();

    // Flip Camera Button Handler
    flipCameraBtn.addEventListener("click", () => {
      useEnvironmentCamera = !useEnvironmentCamera;
      startCamera();
    });

    let lastHeartbeatValue = null;
    let lastChangeTime = Date.now();

    // Check ESP32 Online Status (12 second threshold for hotspot stability)
    async function checkESPConnection() {
      const { data } = await db.from("disarm_game_control").select("heartbeat").eq("id", 1).single();
      const currentTime = Date.now();

      if (data && data.heartbeat !== null) {
        if (data.heartbeat !== lastHeartbeatValue) {
          lastHeartbeatValue = data.heartbeat;
          lastChangeTime = currentTime;
          espStatusDisplay.innerText = "ESP32 Status: Connected & Online";
          espStatusDisplay.style.color = "green";
        } else {
          if (currentTime - lastChangeTime > 12000) {
            espStatusDisplay.innerText = "ESP32 Status: Offline / Not responding";
            espStatusDisplay.style.color = "red";
          }
        }
      } else {
        espStatusDisplay.innerText = "ESP32 Status: Offline / Not responding";
        espStatusDisplay.style.color = "red";
      }
    }
    setInterval(checkESPConnection, 3000);

    nameInput.addEventListener("input", () => {
      startBtn.disabled = nameInput.value.trim() === "";
    });

    // Helper function when game ends
    async function handleGameResult(result) {
      if (!timerInterval) return;

      clearInterval(timerInterval);
      clearInterval(pollInterval);
      timerInterval = null;

      const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
      timerDisplay.innerText = `${finalTime}s`;

      if (result.id) {
        await db.from("disarm_game_results").update({ 
          player_name: nameInput.value.trim(),
          time_seconds: parseFloat(finalTime) 
        }).eq("id", result.id);
      }

      statusMsg.innerText = result.status === "DEFUSED" ? "BOMB DEFUSED!" : "BOOM! GAME OVER!";

      if (activeChannel) {
        db.removeChannel(activeChannel);
        activeChannel = null;
      }

      setTimeout(() => {
        startBtn.disabled = false;
        nameInput.disabled = false;
      }, 3000);
    }

    // Start Game Button Clicked
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      nameInput.disabled = true;
      statusMsg.innerText = "CHECKING WIRES...";

      // 1. Setup Realtime Listener for results FIRST
      activeChannel = db.channel('results-listener')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'disarm_game_results' }, payload => {
          handleGameResult(payload.new);
        })
        .subscribe();

      // 2. Tell ESP32 to start via Supabase
      await db.from("disarm_game_control").update({ command: "START" }).eq("id", 1);

      // 3. Check if ESP32 accepted it or threw a wire error
      let checkAttempts = 0;
      let startAccepted = false;

      const checkInterval = setInterval(async () => {
        checkAttempts++;
        const { data } = await db.from("disarm_game_control").select("command").eq("id", 1).single();

        if (data && data.command === "ERROR_WIRES") {
          clearInterval(checkInterval);
          statusMsg.innerText = "ERROR: Connect all wires first!";
          statusMsg.style.color = "red";
          
          await db.from("disarm_game_control").update({ command: "IDLE" }).eq("id", 1);

          startBtn.disabled = false;
          nameInput.disabled = false;
          startAccepted = true;
        } else if (data && data.command === "IDLE" && !startAccepted) {
          clearInterval(checkInterval);
          startAccepted = true;
          statusMsg.style.color = "black";
          statusMsg.innerText = "DEFUSE THE BOMB!";

          startTime = Date.now();
          timerInterval = setInterval(() => {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            timerDisplay.innerText = `${elapsed}s`;
          }, 50);

          const gameStartTimeStamp = new Date().toISOString();
          pollInterval = setInterval(async () => {
            const { data: resData } = await db.from("disarm_game_results")
              .select("*")
              .gt("created_at", gameStartTimeStamp)
              .order("created_at", { ascending: false })
              .limit(1);

            if (resData && resData.length > 0) {
              handleGameResult(resData[0]);
            }
          }, 1000);
        }

        if (checkAttempts > 15 && !startAccepted) {
          clearInterval(checkInterval);
          statusMsg.innerText = "ESP32 not responding!";
          statusMsg.style.color = "red";
          startBtn.disabled = false;
          nameInput.disabled = false;
        }
      }, 300);
    });
  </script>
</body>
</html>
